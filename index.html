<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>TicketHub — Поиск и бронирование билетов</title>
<style>
:root {
    --primary: #6366f1; --accent: #ec4899; --accent-2: #f59e0b;
    --success: #10b981; --danger: #ef4444;
    --bg: #0a0a1a; --card: rgba(255,255,255,0.06);
    --text: #fff; --muted: #a1a1aa; --border: rgba(255,255,255,0.12);
    --gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height:100vh;
}
.bg-anim { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
.bg-anim::before, .bg-anim::after {
    content:''; position:absolute; width:600px; height:600px;
    border-radius:50%; filter:blur(140px); opacity:0.3;
    animation: float 20s infinite ease-in-out;
}
.bg-anim::before { background:var(--primary); top:-200px; left:-200px; }
.bg-anim::after { background:var(--accent); bottom:-200px; right:-200px; animation-delay:-10s; }
@keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(100px,-50px) scale(1.1); }
}

header {
    padding:18px 5%; display:flex; justify-content:space-between; align-items:center;
    backdrop-filter:blur(20px); background:rgba(10,10,26,0.7);
    position:sticky; top:0; z-index:100; border-bottom:1px solid var(--border);
}
.logo { font-size:24px; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; display:flex; align-items:center; gap:10px; }
.logo-icon { width:36px; height:36px; background:var(--gradient); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; -webkit-text-fill-color:white; }

.hero { padding:40px 5% 20px; text-align:center; max-width:900px; margin:0 auto; }
.hero h1 { font-size:clamp(28px,5vw,44px); font-weight:800; line-height:1.1; margin-bottom:12px; }
.gradient-text { background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero p { color:var(--muted); font-size:15px; }

/* ПОИСК */
.search-box {
    max-width:1000px; margin:30px auto; padding:0 5%;
}
.search-card {
    background:var(--card); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:20px; padding:24px;
}
.search-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.field label { display:block; font-size:11px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
.field input, .field select {
    width:100%; padding:12px; background:rgba(255,255,255,0.05);
    border:1px solid var(--border); border-radius:10px; color:var(--text);
    font-size:14px; font-family:inherit;
}
.field input:focus, .field select:focus { outline:none; border-color:var(--primary); background:rgba(255,255,255,0.08); }

.autocomplete-list {
    position:absolute; top:100%; left:0; right:0;
    background:#1a1a2e; border:1px solid var(--border); border-radius:10px;
    margin-top:4px; max-height:240px; overflow-y:auto; z-index:50; display:none;
}
.autocomplete-list.show { display:block; }
.ac-item { padding:10px 12px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); }
.ac-item:hover { background:rgba(99,102,241,0.15); }
.ac-item .iata { color:var(--primary); font-weight:700; font-family:monospace; font-size:11px; }

.search-btn {
    width:100%; padding:15px; background:var(--gradient); border:none; border-radius:12px;
    color:white; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 8px 24px rgba(99,102,241,0.4); transition:all 0.3s;
}
.search-btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(99,102,241,0.6); }
.search-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

/* РЕЗУЛЬТАТЫ ПОИСКА */
.results-section { max-width:1000px; margin:30px auto; padding:0 5%; display:none; }
.results-section.show { display:block; }
.results-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
.results-title { font-size:22px; font-weight:800; }
.results-count { color:var(--muted); font-size:13px; }

.sort-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn {
    padding:8px 14px; background:var(--card); border:1px solid var(--border);
    border-radius:20px; color:var(--muted); font-size:12px; font-weight:600;
    cursor:pointer; transition:all 0.2s;
}
.filter-btn:hover { color:var(--text); }
.filter-btn.active { background:var(--gradient); color:white; border-color:transparent; }

.ticket-card {
    background:var(--card); backdrop-filter:blur(20px);
    border:1px solid var(--border); border-radius:16px;
    padding:18px; margin-bottom:12px;
    display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center;
    transition:all 0.3s;
}
.ticket-card:hover { border-color:rgba(99,102,241,0.4); transform:translateX(4px); }
.ticket-main { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.airline-logo {
    width:48px; height:48px; border-radius:10px;
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:var(--primary);
    flex-shrink:0;
}
.route-info { flex:1; min-width:200px; }
.route-cities { font-size:16px; font-weight:700; margin-bottom:4px; }
.route-details { color:var(--muted); font-size:12px; display:flex; gap:12px; flex-wrap:wrap; }
.route-details span { display:flex; align-items:center; gap:4px; }
.ticket-price { text-align:right; }
.price-value { font-size:22px; font-weight:800; background:var(--gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.price-label { font-size:11px; color:var(--muted); margin-bottom:8px; }
.book-btn {
    padding:10px 18px; background:var(--gradient); border:none; border-radius:10px;
    color:white; font-size:13px; font-weight:700; cursor:pointer;
    transition:all 0.3s; white-space:nowrap;
}
.book-btn:hover { transform:scale(1.05); box-shadow:0 6px 20px rgba(99,102,241,0.5); }

/* Лоадер */
.loader { text-align:center; padding:40px; display:none; }
.loader.show { display:block; }
.spinner {
    width:40px; height:40px; margin:0 auto 12px;
    border:3px solid rgba(255,255,255,0.1); border-top-color:var(--primary);
    border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loader-text { color:var(--muted); font-size:13px; }

/* Пусто */
.empty-state { text-align:center; padding:40px; color:var(--muted); display:none; }
.empty-state.show { display:block; }
.empty-icon { font-size:48px; margin-bottom:12px; }

/* Статус API */
.api-status {
    position:fixed; bottom:20px; right:20px;
    padding:8px 12px; background:var(--card); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:10px;
    font-size:11px; display:flex; align-items:center; gap:6px;
    z-index:99;
}
.api-dot { width:6px; height:6px; border-radius:50%; }
.api-dot.ok { background:var(--success); box-shadow:0 0 6px var(--success); }
.api-dot.err { background:var(--danger); }

/* Toast */
.toast {
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(200px);
    padding:12px 18px; background:var(--success); color:white;
    border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.3); transition:transform 0.3s; z-index:1000;
}
.toast.show { transform:translateX(-50%) translateY(0); }

@media (max-width:600px) {
    .ticket-card { grid-template-columns:1fr; }
    .ticket-price { text-align:left; display:flex; justify-content:space-between; align-items:center; }
    .search-grid { grid-template-columns:1fr; }
}

// ============================================
// 🔤 АВТОКОМПЛИТ
// ============================================
function setupAC(inputId, listId, hiddenId) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    const hidden = document.getElementById(hiddenId);
    let selIdx = -1, matches = [];

    input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        hidden.value = ''; selIdx = -1;
        if (q.length < 1) { list.classList.remove('show'); return; }

        matches = CITIES.filter(c =>
            c.name.toLowerCase().includes(q) ||
            c.code.toLowerCase().includes(q) ||
            c.country.toLowerCase().includes(q)
        ).slice(0, 12);

        if (!matches.length) { list.classList.remove('show'); return; }

        list.innerHTML = matches.map((c, i) => `
            <div class="ac-item" data-i="${i}" data-code="${c.code}" data-name="${c.name}">
                <span>${c.name}, ${c.country}</span>
                <span class="iata">${c.code}</span>
            </div>
        `).join('');
        list.classList.add('show');

        list.querySelectorAll('.ac-item').forEach(el => {
            el.addEventListener('click', () => {
                input.value = el.dataset.name;
                hidden.value = el.dataset.code;
                list.classList.remove('show');
            });
        });
    });

    input.addEventListener('keydown', (e) => {
        if (!list.classList.contains('show')) return;
        const items = list.querySelectorAll('.ac-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); selIdx = Math.min(selIdx+1, matches.length-1); hl(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); selIdx = Math.max(selIdx-1, -1); hl(items); }
        else if (e.key === 'Enter' && selIdx >= 0) { e.preventDefault(); input.value = matches[selIdx].name; hidden.value = matches[selIdx].code; list.classList.remove('show'); }
        else if (e.key === 'Escape') list.classList.remove('show');
    });

    function hl(items) { items.forEach((it,i) => it.style.background = i===selIdx?'rgba(99,102,241,0.2)':''); }
    input.addEventListener('focus', () => { if (list.children.length && input.value.length) list.classList.add('show'); });
    document.addEventListener('click', e => { if (!input.contains(e.target) && !list.contains(e.target)) list.classList.remove('show'); });
}
setupAC('from','from-list','from-code');

// ============================================
// 🔧 API С КЭШЕМ И RETRY
// ============================================
const CACHE_TTL = 30 * 60 * 1000;
function getCache(k) { try { const it = JSON.parse(localStorage.getItem('c_'+k)); if (!it) return null; if (Date.now()-it.t > CACHE_TTL) return null; return it.d; } catch { return null; } }
function setCache(k, d) { try { localStorage.setItem('c_'+k, JSON.stringify({d, t:Date.now()})); } catch {} }

async function apiGet(path, params, retries=2) {
    const url = new URL(CONFIG.API + path);
    url.searchParams.set('token', CONFIG.TOKEN);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
    const ck = path+'_'+JSON.stringify(params);
    const cached = getCache(ck);
    if (cached) { setStatus('ok','Из кэша'); return {src:'cache',data:cached}; }

    for (let i=1; i<=retries; i++) {
        try {
            const ctrl = new AbortController();
            const t = setTimeout(()=>ctrl.abort(), 10000);
            const r = await fetch(url.toString(), {signal:ctrl.signal});
            clearTimeout(t);
            if (!r.ok) throw new Error('HTTP '+r.status);
            const d = await r.json();
            setCache(ck, d);
            setStatus('ok','API подключён');
            return {src:'api',data:d};
        } catch(e) {
            if (i===retries) { setStatus('err','API недоступен'); return {src:'error',data:null}; }
            await new Promise(r=>setTimeout(r, 1000*i));
        }
    }
}

function setStatus(s, t) {
    const el = document.getElementById('apiStatus');
    el.querySelector('.api-dot').className = 'api-dot ' + (s==='ok'?'ok':'err');
    el.querySelector('span:last-child').textContent = t;
}

// ============================================
// 🔍 ПОИСК БИЛЕТОВ
// ============================================
let currentResults = [];
let currentSearch = {};

async function searchFlights(e) {
    e.preventDefault();
    const from = document.getElementById('from-code').value;
    const to = document.getElementById('to-code').value;
    const fromName = document.getElementById('from').value;
    const toName = document.getElementById('to').value;
    const date = document.getElementById('date').value;

    if (!from || !to) { showToast('️ Выбери города из списка'); return; }

    currentSearch = { from, to, fromName, toName, date };

    // Показываем лоадер
    document.getElementById('loader').classList.add('show');
    document.getElementById('results').classList.remove('show');
    document.getElementById('empty').classList.remove('show');
    document.getElementById('searchBtn').disabled = true;

    // Ищем через 2 эндпоинта параллельно
    const [directRes, cheapRes] = await Promise.all([
        apiGet('/v2/prices/direct', {origin:from, destination:to, date, currency:'rub'}),
        apiGet('/v1/prices/cheap', {origin:from, destination:to, currency:'rub'})
    ]);

    document.getElementById('loader').classList.remove('show');
    document.getElementById('searchBtn').disabled = false;

    const tickets = [];

    // Обработка direct (прямые рейсы на конкретную дату)
    if (directRes.data && directRes.data.success && directRes.data.data) {
        const d = directRes.data.data;
        if (d.price) {
            tickets.push({
                airline: d.airline || '—',
                flightNumber: d.flight_number || '',
                departureAt: d.departure_at || date,
                returnAt: d.return_at || null,
                price: d.price,
                from: fromName, to: toName,
                fromCode: from, toCode: to,
                transfers: d.transfers || 0,
                link: d.link || null,
                duration: d.duration || null
            });
        }
    }

    // Обработка cheap (дешёвые на месяц)
    if (cheapRes.data && cheapRes.data.success && cheapRes.data.data) {
        const entries = Object.entries(cheapRes.data.data).slice(0, 20);
        for (const [destCode, info] of entries) {
            const city = CITIES.find(c=>c.code===destCode);
            if (!city) continue;
            for (const item of (info || [])) {
                if (!item.price || !item.departure_at) continue;
                // Если ищем конкретный маршрут — фильтруем
                if (to && destCode !== to) continue;
                tickets.push({
                    airline: item.airline || '—',
                    flightNumber: item.flight_number || '',
                    departureAt: item.departure_at,
                    returnAt: item.return_at || null,
                    price: item.price,
                    from: fromName, to: city.name,
                    fromCode: from, toCode: destCode,
                    transfers: item.transfers || 0,
                    link: item.link || null,
                    duration: item.duration || null
                });
            }
        }
    }

    // Убираем дубликаты
    const seen = new Set();
    const unique = tickets.filter(t => {
        const key = t.airline + '_' + t.departureAt + '_' + t.price;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });

    currentResults = unique;

    if (unique.length === 0) {
        document.getElementById('empty').classList.add('show');
        document.getElementById('results').classList.remove('show');
        showToast(' Ничего не найдено. Попробуй другие даты.');
        return;
    }

    // Сортируем по цене
    currentResults.sort((a,b) => a.price - b.price);
    renderTickets(currentResults);
}

function renderTickets(tickets) {
    const list = document.getElementById('ticketsList');
    document.getElementById('resultsTitle').textContent = `${currentSearch.fromName} → ${currentSearch.toName}`;
    document.getElementById('resultsCount').textContent = `Найдено ${tickets.length} вариантов • ${new Date(currentSearch.date).toLocaleDateString('ru')}`;

    list.innerHTML = tickets.map(t => {
        const depDate = new Date(t.departureAt);
        const depStr = depDate.toLocaleDateString('ru', {day:'numeric', month:'short', weekday:'short'});
        const depTime = depDate.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'});
        const transfers = t.transfers === 0 ? 'Прямой' : `${t.transfers} пересадк${t.transfers===1?'а':t.transfers<5?'и':'ок'}`;

        // Партнёрская ссылка для оформления
        const bookUrl = `https://www.aviasales.ru/search?marker=${CONFIG.MARKER}&origin=${t.fromCode}&destination=${t.toCode}&departure_date=${t.departureAt.split('T')[0]}&adult=1&currency=rub`;

        return `
        <div class="ticket-card">
            <div class="ticket-main">
                <div class="airline-logo">${t.airline.substring(0,2).toUpperCase()}</div>
                <div class="route-info">
                    <div class="route-cities">${t.from} → ${t.to}</div>
                    <div class="route-details">
                        <span>📅 ${depStr}</span>
                        <span>🕐 ${depTime}</span>
                        <span>✈️ ${t.airline}</span>
                        <span>🔄 ${transfers}</span>
                    </div>
                </div>
            </div>
            <div class="ticket-price">
                <div class="price-value">${t.price.toLocaleString('ru')} ₽</div>
                <div class="price-label">за пассажира</div>
                <button class="book-btn" onclick="bookTicket('${t.fromCode}','${t.toCode}','${t.departureAt.split('T')[0]}','${t.airline}')">Оформить →</button>
            </div>
        </div>`;
    }).join('');

    document.getElementById('results').classList.add('show');
    document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
}

function bookTicket(from, to, date, airline) {
    const url = `https://www.aviasales.ru/search?marker=${CONFIG.MARKER}&origin=${from}&destination=${to}&departure_date=${date}&adult=1&currency=rub`;
    showToast('✈️ Переходим к оформлению...');
    setTimeout(() => window.open(url, '_blank'), 400);
}

function sortResults(by) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (by === 'price') currentResults.sort((a,b) => a.price - b.price);
    else if (by === 'date') currentResults.sort((a,b) => new Date(a.departureAt) - new Date(b.departureAt));
    else if (by === 'airline') currentResults.sort((a,b) => a.airline.localeCompare(b.airline));

    renderTickets(currentResults);
}

// ============================================
// 🔔 TOAST
// ============================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

const today = new Date().toISOString().split('T')[0];
document.getElementById('date').min = today;
document.getElementById('date').value = today;

// ============================================
// 🚀 СТАРТ
// ============================================
setStatus('ok', 'Готов к поиску');
showToast('✅ TicketHub готов!');
</script>
